[build-system]
requires = ["setuptools >= 61"]
build-backend = "setuptools.build_meta"

[project]
name = "telliot-core"
description = "Telliot is a Python framework for interacting with the decentralized TellorX network."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Tellor Development Community", email = "info@tellor.io" }]
keywords = ["oracle", "ethereum", "blockchain"]
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Networking",
    "Topic :: Office/Business :: Financial",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # imported directly but never declared before the uv conversion
    "aiohttp>=3.11,<4",  # ranged, not pinned: 3.11.13 (used by feeds/dvm) is yanked upstream
    "eth-typing>=5,<6",
    "eth-utils>=5,<6",
    "hexbytes>=1.2,<2",
    # floors preserved from setup.cfg (attrs/protobuf are transitively relied on by pip users)
    "attrs>=25.1.0",
    "chained-accounts==0.0.1",
    "clamfig==0.1.3",
    "click>=8.1,<9",
    "protobuf>=5.29.3",  # CVE-2024-7254 security floor
    "PyYAML>=6.0",
    "requests>=2.32.3",
    "web3>=7,<8",
]

[project.urls]
Homepage = "https://github.com/tellor-io/telliot-core"

[project.scripts]
telliot-core = "telliot_core.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.dynamic]
version = { attr = "telliot_core.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.csv", "*.json"]

[dependency-groups]
dev = [
    "ape-hardhat",
    "ape-solidity",
    "eth-ape",
    # mkdocs 2.0 is only pre-releases; prerelease="allow" would pull them in
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9,<10",
    "mypy",
    "mypy-extensions",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-dotenv",
    "types-PyYAML",
    "types-requests",
]

[tool.uv]
# eth-ape's tree carries prerelease transitives (e.g. eth-tester 0.13.0b1),
# mirroring the proven telliot-feeds resolution.
prerelease = "allow"

# Pytest Live Logs breaks some CliRunner tests.
#   - https://github.com/pallets/click/issues/2156
#   - https://github.com/pallets/click/issues/824
# [tool.pytest.ini_options]
# log_cli = true
# log_cli_level = "INFO"
[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
